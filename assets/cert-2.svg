<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fcfbf7"/>

  <!-- Border Frame -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#dcd6c8" stroke-width="1.5"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#e8e2d4" stroke-width="1"/>

  <!-- Left Crest / Seal -->
  <g transform="translate(60, 50)">
    <circle cx="20" cy="20" r="20" fill="#a83232"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="#d5a021" stroke-width="2"/>
    <polygon points="20,8 24,16 32,16 26,22 28,30 20,25 12,30 14,22 8,16 16,16" fill="#d5a021"/>
  </g>

  <!-- Right CODL Logo -->
  <g transform="translate(500, 50)">
    <circle cx="20" cy="20" r="18" fill="#7b2cbf"/>
    <text x="20" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CODL</text>
  </g>

  <!-- Headers -->
  <text x="300" y="60" fill="#1a202c" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle">Centre for Open &amp; Distance Learning (CODL)</text>
  <text x="300" y="80" fill="#2d3748" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">University of Moratuwa, Sri Lanka</text>

  <text x="300" y="120" fill="#4a5568" font-family="Georgia, serif" font-style="italic" font-size="13" text-anchor="middle">This is to certify that</text>

  <!-- Name -->
  <text x="300" y="165" fill="#1a202c" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle">Mary Rengel Sosai</text>
  <line x1="180" y1="175" x2="420" y2="175" stroke="#a0aec0" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Body text -->
  <text x="300" y="210" fill="#4a5568" font-family="Georgia, serif" font-size="13" text-anchor="middle">has participated in the online learning programme in</text>
  <text x="300" y="235" fill="#0d1b2a" font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle">Python for Beginners</text>

  <!-- Conducted by -->
  <text x="300" y="275" fill="#4a5568" font-family="Georgia, serif" font-size="11" text-anchor="middle">conducted by the</text>
  <text x="300" y="292" fill="#2d3748" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">Department of Computer Science &amp; Engineering,</text>
  <text x="300" y="308" fill="#2d3748" font-family="Georgia, serif" font-size="11" text-anchor="middle">Faculty of Engineering, University of Moratuwa</text>

  <!-- QR Code Mockup -->
  <g transform="translate(280, 330)">
    <rect x="0" y="0" width="40" height="40" fill="#ffffff" stroke="#2d3748" stroke-width="1.5"/>
    <rect x="5" y="5" width="10" height="10" fill="#1a202c"/>
    <rect x="25" y="5" width="10" height="10" fill="#1a202c"/>
    <rect x="5" y="25" width="10" height="10" fill="#1a202c"/>
    <rect x="18" y="18" width="6" height="6" fill="#1a202c"/>
    <rect x="27" y="27" width="8" height="8" fill="#1a202c"/>
  </g>
</svg>
