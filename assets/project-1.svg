<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#adminBg)"/>
  
  <!-- Sidebar mockup -->
  <rect x="20" y="20" width="100" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="40" width="70" height="12" rx="6" fill="#3b82f6"/>
  <rect x="35" y="75" width="70" height="8" rx="4" fill="#64748b"/>
  <rect x="35" y="100" width="70" height="8" rx="4" fill="#64748b"/>
  <rect x="35" y="125" width="70" height="8" rx="4" fill="#64748b"/>
  <rect x="35" y="150" width="70" height="8" rx="4" fill="#64748b"/>

  <!-- Top bar -->
  <rect x="135" y="20" width="445" height="45" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Admin Dashboard</text>
  <circle cx="550" cy="42" r="14" fill="#3b82f6"/>

  <!-- Stat Cards -->
  <rect x="135" y="80" width="135" height="75" rx="10" fill="#334155"/>
  <text x="150" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Total Users</text>
  <text x="150" y="138" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">24,580</text>

  <rect x="285" y="80" width="135" height="75" rx="10" fill="#334155"/>
  <text x="300" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Active Sessions</text>
  <text x="300" y="138" fill="#4ade80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">1,420</text>

  <rect x="435" y="80" width="145" height="75" rx="10" fill="#334155"/>
  <text x="450" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">System Revenue</text>
  <text x="450" y="138" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">$84,320</text>

  <!-- Analytics Chart Area -->
  <rect x="135" y="170" width="445" height="210" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="155" y="200" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Analytics Overview</text>
  
  <!-- Wave chart path -->
  <path d="M 155 330 Q 230 250, 310 290 T 460 220 T 555 240 L 555 350 L 155 350 Z" fill="url(#chartGrad)"/>
  <path d="M 155 330 Q 230 250, 310 290 T 460 220 T 555 240" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="460" cy="220" r="5" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
</svg>
