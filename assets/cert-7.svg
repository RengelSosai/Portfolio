<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="msGreenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="msGreenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Border -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Right Geometric Accent (Green block like in Microsoft Student Ambassadors cert) -->
  <polygon points="450,15 600,15 600,140" fill="url(#msGreenAccent)"/>
  <polygon points="520,15 600,15 600,80" fill="url(#msGreenLight)" opacity="0.6"/>

  <!-- Left Header: Microsoft Student Ambassadors -->
  <g transform="translate(40, 45)">
    <!-- Microsoft 4-color square grid logo -->
    <rect x="0" y="0" width="11" height="11" fill="#f25022"/>
    <rect x="13" y="0" width="11" height="11" fill="#7fba00"/>
    <rect x="0" y="13" width="11" height="11" fill="#00a4ef"/>
    <rect x="13" y="13" width="11" height="11" fill="#ffb900"/>
    <text x="32" y="18" fill="#334155" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Microsoft Student Ambassadors</text>
  </g>

  <!-- Center Content -->
  <text x="300" y="130" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">This certificate is presented to</text>

  <!-- Recipient Name -->
  <text x="300" y="175" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle">R. Mary Rengel Sosai</text>
  <line x1="180" y1="188" x2="420" y2="188" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="300" y="215" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">In recognition of your attendance and completion of the workshop on</text>

  <!-- Course Title -->
  <text x="300" y="255" fill="#047857" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Introduction to Github &amp; Github Action</text>

  <!-- Bottom Details & Signatures -->
  <g transform="translate(60, 315)">
    <path d="M 0 15 Q 25 0 50 15 T 90 10" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="25" x2="120" y2="25" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="38" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Microsoft Student Ambassador</text>
  </g>

  <g transform="translate(420, 315)">
    <circle cx="60" cy="10" r="16" fill="#059669"/>
    <text x="60" y="14" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MLSA</text>
    <text x="60" y="38" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Verified Badge</text>
  </g>
</svg>
