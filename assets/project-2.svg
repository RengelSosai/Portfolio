<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="flowerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#flowerBg)"/>
  
  <rect x="30" y="30" width="540" height="340" rx="20" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/>
  
  <!-- Flower Stems -->
  <path d="M 220 320 C 210 240, 230 180, 200 130" fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 300 320 C 290 230, 310 160, 300 110" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 380 320 C 390 240, 370 170, 400 130" fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Leaves -->
  <path d="M 215 250 Q 150 220 180 180 Q 210 220 215 250 Z" fill="#22c55e"/>
  <path d="M 305 240 Q 370 210 340 170 Q 300 210 305 240 Z" fill="#16a34a"/>
  
  <!-- Tulip Blossoms -->
  <!-- Left Tulip -->
  <path d="M 170 130 C 160 90, 200 70, 200 130 Z" fill="#f472b6"/>
  <path d="M 200 130 C 200 70, 240 90, 230 130 Z" fill="#ec4899"/>
  <path d="M 185 130 C 180 85, 220 85, 215 130 Z" fill="#f43f5e"/>

  <!-- Center Tulip -->
  <path d="M 265 110 C 255 60, 300 40, 300 110 Z" fill="#f472b6"/>
  <path d="M 300 110 C 300 40, 345 60, 335 110 Z" fill="#ec4899"/>
  <path d="M 280 110 C 275 55, 325 55, 320 110 Z" fill="#fb7185"/>

  <!-- Right Tulip -->
  <path d="M 370 130 C 360 90, 400 70, 400 130 Z" fill="#f472b6"/>
  <path d="M 400 130 C 400 70, 440 90, 430 130 Z" fill="#ec4899"/>
  <path d="M 385 130 C 380 85, 420 85, 415 130 Z" fill="#f43f5e"/>

  <!-- Title Card Overlay -->
  <rect x="50" y="280" width="500" height="70" rx="14" fill="#1e293b" opacity="0.92"/>
  <text x="75" y="312" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22">Secret Garden Flower Shop</text>
  <text x="75" y="335" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Boutique Floral E-Commerce Storefront &amp; Cart UI</text>
</svg>
