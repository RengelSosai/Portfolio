<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="animeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#1f093a"/>
      <stop offset="100%" stop-color="#4c0677"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#animeGrad)"/>
  
  <circle cx="520" cy="80" r="140" fill="#ff0055" opacity="0.3"/>
  <circle cx="80" cy="320" r="120" fill="#9333ea" opacity="0.25"/>

  <!-- Anime Banner Frame -->
  <rect x="40" y="40" width="520" height="200" rx="16" fill="#130a24" stroke="#ff0055" stroke-width="2"/>
  
  <rect x="60" y="65" width="100" height="26" rx="13" fill="url(#neonRed)"/>
  <text x="110" y="82" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">HOT RELEASE</text>

  <text x="60" y="140" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34">YOUR ANIME</text>
  <text x="60" y="180" fill="#ff0055" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34">WORLD</text>

  <!-- Play Icon Circle -->
  <circle cx="480" cy="140" r="35" fill="url(#neonRed)"/>
  <polygon points="473,125 493,140 473,155" fill="#ffffff"/>

  <!-- Anime Cards grid preview at bottom -->
  <rect x="40" y="260" width="155" height="100" rx="10" fill="#1e1035" stroke="#3b1764"/>
  <rect x="222" y="260" width="155" height="100" rx="10" fill="#1e1035" stroke="#3b1764"/>
  <rect x="405" y="260" width="155" height="100" rx="10" fill="#1e1035" stroke="#3b1764"/>

  <text x="55" y="315" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Jujutsu Kaisen</text>
  <text x="237" y="315" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Demon Slayer</text>
  <text x="420" y="315" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Attack on Titan</text>
</svg>
