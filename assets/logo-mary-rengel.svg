<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1c30"/>
      <stop offset="100%" stop-color="#162947"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#f5b027"/>
      <stop offset="100%" stop-color="#c67d0a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 4" />
  
  <!-- Monogram MR -->
  <g transform="translate(100, 106)" text-anchor="middle">
    <!-- Shadow / Backdrop Text -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="-2">MR</text>
  </g>
  
  <!-- Decorative Accent Dot -->
  <circle cx="148" cy="120" r="6" fill="url(#blueGrad)" />
</svg>
