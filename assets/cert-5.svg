<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#fcfbfa"/>

  <!-- Gold Decorative Border -->
  <rect x="12" y="12" width="576" height="376" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Corner Accents -->
  <path d="M 12 40 L 40 12 M 588 40 L 560 12 M 12 360 L 40 388 M 588 360 L 560 388" stroke="url(#goldBorder)" stroke-width="3"/>

  <!-- Header Logos -->
  <g transform="translate(180, 45)">
    <!-- Logo 1 -->
    <circle cx="20" cy="15" r="14" fill="#1e3a8a"/>
    <circle cx="20" cy="15" r="10" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Logo 2 -->
    <circle cx="120" cy="15" r="14" fill="#047857"/>
    <text x="120" y="19" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">BCML</text>
    <!-- Logo 3 -->
    <circle cx="220" cy="15" r="14" fill="#b91c1c"/>
    <text x="220" y="19" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">LIVE</text>
  </g>

  <!-- Gold Award Ribbon/Seal Top Right -->
  <g transform="translate(520, 35)">
    <circle cx="20" cy="20" r="22" fill="url(#goldSeal)" stroke="#b8860b" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="17" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M 10 38 L 10 55 L 20 48 L 30 55 L 30 38 Z" fill="#ca8a04"/>
  </g>

  <!-- Main Certificate Titles -->
  <text x="300" y="115" fill="#1e293b" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="2" text-anchor="middle">CERTIFICATE</text>
  <text x="300" y="135" fill="#ca8a04" font-family="Georgia, serif" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle">OF APPRECIATION</text>
  
  <text x="300" y="165" fill="#64748b" font-family="Georgia, serif" font-style="italic" font-size="11" text-anchor="middle">THIS CERTIFICATE IS PROUDLY PRESENTED TO</text>

  <!-- Recipient Name -->
  <text x="300" y="205" fill="#0f172a" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle">Mary Rengel Sosai</text>
  <line x1="160" y1="215" x2="440" y2="215" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Appreciation Body Text -->
  <text x="300" y="245" fill="#334155" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">In Recognition of Outstanding Volunteer Services</text>
  <text x="300" y="268" fill="#475569" font-family="sans-serif" font-size="10" text-anchor="middle">We hereby express our sincere gratitude and appreciation for your dedicated assistance</text>
  <text x="300" y="284" fill="#475569" font-family="sans-serif" font-size="10" text-anchor="middle">and outstanding contributions as a volunteer for community and student initiatives.</text>

  <!-- Signatures -->
  <g transform="translate(130, 320)">
    <path d="M 0 15 Q 25 0 50 15 T 100 10" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="25" x2="100" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <text x="50" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Event Coordinator</text>
  </g>

  <g transform="translate(370, 320)">
    <path d="M 0 10 Q 25 20 50 5 T 100 15" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="25" x2="100" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <text x="50" y="38" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Executive Chairman</text>
  </g>
</svg>
