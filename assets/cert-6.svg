<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e09"/>
      <stop offset="50%" stop-color="#0a1d12"/>
      <stop offset="100%" stop-color="#040a06"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#cyberBg)"/>
  <rect width="600" height="400" fill="url(#greenGlow)"/>

  <!-- Cyber Grid Lines overlay -->
  <path d="M 0 50 L 600 50 M 0 100 L 600 100 M 0 150 L 600 150 M 0 200 L 600 200 M 0 250 L 600 250 M 0 300 L 600 300 M 0 350 L 600 350" stroke="#052e16" stroke-width="1" opacity="0.6"/>
  <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400" stroke="#052e16" stroke-width="1" opacity="0.6"/>

  <!-- Border -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#059669" stroke-width="1" opacity="0.4"/>

  <!-- Left Side: Hooded Hacker Graphic with Glowing Orb -->
  <g transform="translate(45, 80)">
    <!-- Hood silhouette -->
    <path d="M 80 40 Q 120 10 160 40 Q 185 90 170 170 Q 120 220 70 170 Q 55 90 80 40 Z" fill="#061f12" stroke="#10b981" stroke-width="2"/>
    <!-- Face Shadow -->
    <path d="M 95 65 Q 120 45 145 65 L 140 120 Q 120 135 100 120 Z" fill="#020804"/>
    <!-- Glowing eyes/orbs -->
    <circle cx="110" cy="85" r="4" fill="#34d399"/>
    <circle cx="130" cy="85" r="4" fill="#34d399"/>
    <!-- Glowing Hands with Energy Ball -->
    <circle cx="120" cy="170" r="28" fill="#34d399" opacity="0.25"/>
    <circle cx="120" cy="170" r="18" fill="#10b981" opacity="0.6"/>
    <circle cx="120" cy="170" r="10" fill="#a7f3d0"/>
  </g>

  <!-- Right Side: Certificate Text Content -->
  <!-- Top Header Banner -->
  <rect x="250" y="45" width="310" height="40" fill="#047857" rx="6" opacity="0.3"/>
  <text x="405" y="72" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="3" text-anchor="middle">CERTIFICATE</text>
  <text x="405" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="10" letter-spacing="4" text-anchor="middle">OF PARTICIPATION</text>

  <!-- Event Title -->
  <text x="405" y="140" fill="#ffffff" font-family="impact, sans-serif" font-size="28" letter-spacing="2" text-anchor="middle">G.I.JOES'S</text>
  <text x="405" y="162" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">CYBER BATTLE HYDRA CTF</text>

  <!-- Name -->
  <text x="405" y="200" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">THIS IS AWARDED TO</text>
  <text x="405" y="235" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Mary Rengel Sosai</text>
  <line x1="280" y1="248" x2="530" y2="248" stroke="#059669" stroke-width="1.5"/>

  <!-- Description -->
  <text x="405" y="280" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">For successfully participating in the Capture The Flag (CTF)</text>
  <text x="405" y="296" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Cyber Security Competition showcasing threat defense &amp; hacking skills.</text>

  <!-- Bottom Badges / Signature -->
  <g transform="translate(300, 330)">
    <text x="0" y="15" fill="#059669" font-family="monospace" font-size="10">#STATUS: VERIFIED</text>
    <text x="0" y="30" fill="#6b7280" font-family="monospace" font-size="9">RANK: PARTICIPANT</text>
  </g>
  <g transform="translate(470, 330)">
    <text x="0" y="15" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">G.I.JOES TEAM</text>
    <text x="0" y="30" fill="#6b7280" font-family="sans-serif" font-size="9">CTF Organizers</text>
  </g>
</svg>
