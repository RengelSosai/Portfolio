<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="scrimbaBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#718096"/>
    </linearGradient>
    <linearGradient id="polyOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#scrimbaBg1)"/>

  <!-- Subtle Geometric Triangles -->
  <polygon points="0,400 300,200 600,400" fill="url(#polyOverlay)"/>
  <polygon points="150,0 300,200 450,0" fill="url(#polyOverlay)"/>

  <!-- Border -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Header -->
  <text x="300" y="70" fill="#cbd5e0" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="3" text-anchor="middle" font-weight="600">CERTIFICATE OF COMPLETION</text>

  <!-- Name -->
  <text x="300" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" text-anchor="middle" font-weight="600">Mary Rengel Sosai</text>
  <text x="300" y="150" fill="#a0aec0" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1" text-anchor="middle">COMPLETED THE SCRIMBA COURSE</text>

  <!-- Course Title -->
  <text x="300" y="200" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" text-anchor="middle" font-weight="800" letter-spacing="1.5">LEARN JAVASCRIPT</text>

  <!-- Stat Pills -->
  <g transform="translate(230, 230)">
    <rect x="0" y="0" width="60" height="40" rx="8" fill="none" stroke="#cbd5e0" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">9.4</text>
    <text x="30" y="32" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">HOURS</text>

    <rect x="80" y="0" width="60" height="40" rx="8" fill="none" stroke="#cbd5e0" stroke-width="1" stroke-opacity="0.5"/>
    <text x="110" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">238</text>
    <text x="110" y="32" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">LESSONS</text>
  </g>

  <!-- Signature & Footer -->
  <path d="M 120 310 Q 140 295 160 310 T 200 300" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <text x="160" y="325" fill="#a0aec0" font-family="sans-serif" font-size="10" text-anchor="middle">Per Harald Borgen</text>
  <text x="160" y="337" fill="#718096" font-family="sans-serif" font-size="8" text-anchor="middle">CEO, Scrimba</text>

  <text x="440" y="325" fill="#a0aec0" font-family="sans-serif" font-size="10" text-anchor="middle">Monday, 6 April 2026</text>
  <text x="440" y="337" fill="#718096" font-family="sans-serif" font-size="8" text-anchor="middle">Completion Date</text>
</svg>
